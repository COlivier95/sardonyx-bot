name: Photos d'une annonce
on:
  workflow_dispatch:
    inputs:
      auction:
        description: "ID d'enchère Yahoo"
        required: true
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Télécharger les photos
        run: |
          mkdir photos
          curl -sL -A "Mozilla/5.0" "https://auctions.yahoo.co.jp/jp/auction/${{ inputs.auction }}" -o page.html
          grep -oE 'https://auctions\.c\.yimg\.jp/images\.auctions\.yahoo\.co\.jp/image/[^"\\? ]+\.jpg' page.html | sort -u | head -8 > urls.txt
          cat urls.txt
          n=0; while read u; do n=$((n+1)); curl -sL -A "Mozilla/5.0" "$u" -o photos/$n.jpg; done < urls.txt
          ls -la photos
          python3 - <<'PY'
          import re,html
          s=open('page.html',encoding='utf-8',errors='ignore').read()
          s=s.replace('\\"','"')
          for k in ['title','price','bidCount','endTime','itemCondition']:
              m=re.search('"%s":("([^"]*)"|[^,}]+)'%k,s); print(k, m.group(1) if m else None)
          t=re.sub(r'<script[\s\S]*?</script>','',open('page.html',encoding='utf-8',errors='ignore').read()); t=re.sub(r'<[^>]+>','\n',t)
          i=t.find('商品説明'); print('DESC', re.sub(r'\s+',' ',html.unescape(t[i:i+2500])))
          PY
      - name: Déposer les photos dans une branche dédiée
        run: |
          cd photos
          git init -q -b photos && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -q -m "photos ${{ inputs.auction }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photos:photos-${{ inputs.auction }}
