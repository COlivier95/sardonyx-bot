name: Scan sardonyx

on:
  schedule:
    - cron: "3-58/5 * * * *"  # toutes les 5 min, décalé des heures pile (GitHub peut en sauter)
  workflow_dispatch:         # bouton "Run workflow" pour tester à la main
    inputs:
      test_wake:
        description: "Envoyer une alerte de réveil de test (e-mail SARDONYX)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scanner Mercari et Yahoo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          TEST_WAKE: ${{ inputs.test_wake && '1' || '0' }}
        run: node scan.mjs

      - name: Mémoriser les annonces vues
        run: |
          # GitHub met en pause les tâches planifiées après 60 jours sans activité :
          # un petit fichier daté est mis à jour toutes les 3 semaines pour l'éviter.
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 1814400 ]; then date -u +%FT%TZ > keepalive.txt; fi
          git config user.name "sardonyx-bot"
          git config user.email "sardonyx-bot@users.noreply.github.com"
          git add seen.json keepalive.txt 2>/dev/null || git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "scan: annonces vues"
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
