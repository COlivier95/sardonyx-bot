name: Scan ponctuel
on:
  workflow_dispatch:
    inputs:
      keywords:
        description: "Mots-clés séparés par |"
        required: true
        default: "9940-7010"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node probe.mjs "${{ inputs.keywords }}"
